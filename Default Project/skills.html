<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FERELLY | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="bg"></canvas>

  <header class="hud">
    <div class="hud-left">
      <a href="index.html" class="logo">FERREL.ID</a>
      <span class="tag">// PLAYER.LVL.09</span>
    </div>
    <nav class="hud-nav">
      <a href="index.html">[ HOME ]</a>
      <a href="about.html">[ ABOUT ]</a>
      <a href="skills.html" class="active">[ SKILLS ]</a>
      <a href="projects.html">[ PROJECTS ]</a>
      <a href="contact.html">[ CONTACT ]</a>
    </nav>
    <div class="hud-stats">
      <div class="stat"><span class="stat-bar" id="hpBar"></span><span class="stat-label">HP</span></div>
      <div class="stat"><span class="stat-bar xp" id="xpBar"></span><span class="stat-label">XP</span></div>
    </div>
  </header>

  <main>
    <section id="skills" class="section">
      <h2 class="section-title">&gt; KEMAMPUAN</h2>
      <div class="skills-grid">
        <div class="skill"><span>Wireless</span><div class="mini-bar"><i style="--w:90%"></i></div></div>
        <div class="skill"><span>Crimping Kabel</span><div class="mini-bar"><i style="--w:85%"></i></div></div>
        <div class="skill"><span>Routing</span><div class="mini-bar"><i style="--w:80%"></i></div></div>
        <div class="skill"><span>Fiber Optic</span><div class="mini-bar"><i style="--w:75%"></i></div></div>
        <div class="skill"><span>Roleplay</span><div class="mini-bar"><i style="--w:70%"></i></div></div>
      </div>
      <p class="back"><a href="index.html">◀ KEMBALI KE BERANDA</a></p>
    </section>
  </main>

  <div class="route" aria-hidden="true">
    <div class="route-status">
      <span class="route-clock" id="routeClock">--:--:-- WIB</span>
      <span class="route-date" id="routeDate">-- --- ----</span>
    </div>
    <svg class="route-svg" viewBox="0 0 1200 130">
      <path id="routePath" class="route-line" d="M 20,95 C 300,25 600,115 1180,45" />
      <g class="waypoints">
        <circle cx="20" cy="95" r="5" />
        <circle cx="238" cy="67" r="4" />
        <circle cx="488" cy="70" r="4" />
        <circle cx="793" cy="73" r="4" />
        <circle cx="1180" cy="45" r="5" />
      </g>
      <text x="14" y="112" class="route-label">START</text>
      <text x="1155" y="32" class="route-label">DEST</text>
      <g>
        <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
          <mpath href="#routePath" />
        </animateMotion>
        <g class="route-car" transform="translate(-14,-8) scale(1.5)">
          <circle cx="5" cy="10" r="3" fill="#0b0b0d" stroke="#fff" stroke-width="1.5" />
          <circle cx="26" cy="10" r="3" fill="#0b0b0d" stroke="#fff" stroke-width="1.5" />
          <polygon points="2,3 8,3 10,7 30,7 32,3 35,6 37,11 2,11" fill="#e8e8ee" />
          <rect x="10" y="1" width="11" height="5" fill="#6f6f78" />
          <rect x="34" y="6" width="3" height="5" fill="#fff" />
        </g>
      </g>
    </svg>
  </div>

  <footer class="footer">
    © 2026 FERRELY — Made with <span class="neon-heart">♥</span> in the Grid.
  </footer>

  <script src="script.js"></script>
</body>
</html>
