  <path d="M428 472 C 424 430, 556 422, 574 470 C 588 514, 466 544, 428 472 Z" fill="none" stroke="rgba(52,211,153,0.32)" stroke-width="1.5"/>
  <path d="M452 474 C 450 444, 534 438, 548 472 C 560 508, 482 528, 452 474 Z" fill="none" stroke="rgba(52,211,153,0.26)" stroke-width="1.2"/>
  <path d="M472 476 C 470 458, 516 452, 524 474 C 532 496, 486 512, 472 476 Z" fill="none" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <text x="500" y="516" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#6fd8a5" opacity="0.6">DATARAN TINGGI BOGOR</text>

