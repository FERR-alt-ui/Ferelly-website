    <path d="M400 200 L452 335 L485 448" fill="none" stroke="rgba(2,8,20,0.55)" stroke-width="7" stroke-linecap="round"/>
    <path d="M400 200 L215 212" fill="none" stroke="rgba(2,8,20,0.55)" stroke-width="7" stroke-linecap="round"/>
    <path d="M400 200 L612 208 L705 268" fill="none" stroke="rgba(2,8,20,0.55)" stroke-width="7" stroke-linecap="round"/>
    <path d="M215 212 C 240 265, 268 292, 305 305 C 365 332, 420 342, 452 335 C 500 310, 565 255, 612 208" fill="none" stroke="rgba(2,8,20,0.55)" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g class="jalan" opacity="0.9">
    <path d="M400 200 L452 335 L485 448" fill="none" stroke="rgba(148,163,184,0.5)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M400 200 L215 212" fill="none" stroke="rgba(148,163,184,0.5)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M400 200 L612 208 L705 268" fill="none" stroke="rgba(148,163,184,0.5)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M215 212 C 240 265, 268 292, 305 305 C 365 332, 420 342, 452 335 C 500 310, 565 255, 612 208" fill="none" stroke="rgba(148,163,184,0.5)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <path class="jawa-route-glow" d="M452 335 L400 200 L215 212 C 240 265, 268 292, 305 305 L452 335 C 500 310, 565 255, 612 208 L400 200 L452 335" fill="none" stroke="#22d3ee" stroke-width="9" opacity="0.18" filter="url(#lembut)"/>
  <path class="jawa-route" d="M452 335 L400 200 L215 212 C 240 265, 268 292, 305 305 L452 335 C 500 310, 565 255, 612 208 L400 200 L452 335" fill="none" stroke="url(#rute)" stroke-width="3.2" stroke-dasharray="3 11" stroke-linecap="round"/>

  <g class="jawa-city" data-kota="Jakarta">
    <circle cx="400" cy="200" r="24" fill="url(#glow)"/>
    <circle class="ring" cx="400" cy="200" r="6" fill="none" stroke="#22d3ee" stroke-width="1.6">
      <animate attributeName="r" values="5;26" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle class="jawa-dot" cx="400" cy="200" r="6" fill="#22d3ee" stroke="#eaf2fb" stroke-width="1.8"/>
    <text class="jawa-label" x="416" y="204" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#eaf2fb">Jakarta</text>
    <text class="jawa-sub" x="416" y="219" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#8fa8c2">Kantor &amp; meeting</text>
  </g>

