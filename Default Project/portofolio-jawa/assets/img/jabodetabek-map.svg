    <text class="jawa-label" x="705" y="292" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#d7ecff">Karawang</text>
    <text class="jawa-sub" x="705" y="307" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#8fa8c2">Kawasan industri</text>
  </g>

  <g class="jawa-city" data-kota="Depok">
    <circle cx="452" cy="335" r="24" fill="url(#glow)"/>
    <circle class="ring" cx="452" cy="335" r="6" fill="none" stroke="#fbbf24" stroke-width="1.8">
      <animate attributeName="r" values="5;26" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2.6s" repeatCount="indefinite"/>
