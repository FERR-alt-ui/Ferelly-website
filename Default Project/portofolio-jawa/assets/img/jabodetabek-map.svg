    <text class="jawa-sub" x="434" y="346" text-anchor="end" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#f5c569">Rumah &amp; markas</text>
  </g>

  <g class="jawa-city" data-kota="Bogor">
    <circle cx="485" cy="448" r="20" fill="url(#glow)"/>
    <circle class="ring" cx="485" cy="448" r="6" fill="none" stroke="#34d399" stroke-width="1.6">
      <animate attributeName="r" values="5;22" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle class="jawa-dot" cx="485" cy="448" r="5" fill="#34d399" stroke="#eaf2fb" stroke-width="1.6"/>
    <text class="jawa-label" x="485" y="472" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#eaf2fb">Bogor</text>
    <text class="jawa-sub" x="485" y="488" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#8fa8c2">Meeting pelanggan</text>
