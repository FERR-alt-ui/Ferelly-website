<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Peta Kawasan Jabodetabek">
  <defs>
    <linearGradient id="laut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2138"/>
      <stop offset="1" stop-color="#123a5c"/>
    </linearGradient>
    <linearGradient id="daratan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fa268"/>
      <stop offset="0.45" stop-color="#268450"/>
      <stop offset="1" stop-color="#154c34"/>
    </linearGradient>
    <linearGradient id="rute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <filter id="lembut" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#laut)"/>
  <rect width="800" height="520" fill="url(#grid)"/>

  <circle cx="400" cy="240" r="270" fill="url(#glow)" opacity="0.55"/>
  <circle cx="452" cy="335" r="120" fill="url(#glow)" opacity="0.35"/>

  <text x="30" y="46" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="17" font-weight="800" letter-spacing="5" fill="#5eead4">JABODETABEK</text>
  <text x="30" y="66" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.5" fill="#8fb8d6" opacity="0.85">PETA RUTE KERJA HARIAN</text>
  <text x="30" y="96" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#5eead4" opacity="0.7">LAUT JAWA</text>

  <g class="kompas" transform="translate(758 66)" opacity="0.85">
    <circle cx="0" cy="0" r="17" fill="rgba(34,211,238,0.08)" stroke="rgba(148,163,184,0.35)"/>
    <path d="M0 -12 L4.5 4.5 L0 1.5 L-4.5 4.5 Z" fill="#22d3ee"/>
    <path d="M0 12 L4.5 -4.5 L0 -1.5 L-4.5 -4.5 Z" fill="#64748b"/>
    <text y="-24" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="10" fill="#93a9c2">U</text>
  </g>

  <path d="M215 212 C 300 158, 640 168, 715 268 C 732 340, 628 468, 500 458 C 358 448, 214 348, 215 212 Z" fill="none" stroke="#22d3ee" stroke-width="5" opacity="0.16" filter="url(#lembut)"/>
  <path d="M215 212 C 300 158, 640 168, 715 268 C 732 340, 628 468, 500 458 C 358 448, 214 348, 215 212 Z" fill="rgba(34,211,238,0.05)" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="6 10" stroke-linejoin="round"/>

  <path d="M15 168 C 80 160, 150 154, 220 150 C 260 148, 290 142, 312 144 C 335 146, 348 160, 370 172 C 392 182, 414 182, 436 172 C 458 162, 468 144, 494 140 C 540 134, 620 130, 700 132 C 745 133, 772 142, 785 158 L 785 520 L 15 520 Z" fill="url(#daratan)" stroke="#1a5a38" stroke-width="2"/>

