    <text class="jawa-label" x="612" y="192" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#eaf2fb">Bekasi</text>
    <text class="jawa-sub" x="612" y="232" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#8fa8c2">Gudang &amp; produksi</text>
